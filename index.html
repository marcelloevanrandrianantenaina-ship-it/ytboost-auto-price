<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ẞoost-by Ecr_aaM</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
padding-bottom:100px;
}

header{
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
background:#0d1224;
position:sticky;
top:0;
z-index:1000;
border-bottom:1px solid #00d5ff33;
}

.logo{
font-size:22px;
font-weight:bold;
color:#00d5ff;
}

.status{
font-size:13px;
color:#00ff99;
}

.banner{
background:linear-gradient(90deg,#00d5ff,#0077ff);
padding:10px;
overflow:hidden;
white-space:nowrap;
font-size:14px;
font-weight:bold;
}

.banner span{
display:inline-block;
padding-left:100%;
animation:scroll 15s linear infinite;
}

@keyframes scroll{
0%{transform:translateX(0);}
100%{transform:translateX(-100%);}
}

.tabs{
display:flex;
justify-content:center;
gap:10px;
padding:20px;
}

.tab{
background:#11182d;
padding:10px 18px;
border-radius:12px;
font-size:14px;
}

.services{
padding:15px;
display:grid;
gap:20px;
}

.card{
background:#0d1224;
padding:20px;
border-radius:18px;
box-shadow:0 0 15px #00d5ff22;
border:1px solid #00d5ff22;
}

.badges{
display:flex;
gap:10px;
margin-bottom:12px;
flex-wrap:wrap;
}

.badge{
padding:5px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.top{
background:#ff9900;
color:black;
}

.new{
background:#00ff99;
color:black;
}

.fast{
background:#00d5ff;
color:black;
}

.service-title{
font-size:20px;
margin-bottom:10px;
}

.price{
font-size:28px;
font-weight:bold;
color:#00ffcc;
margin:10px 0;
}

.info{
color:#aaa;
font-size:14px;
margin-bottom:15px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00d5ff,#0077ff);
color:white;
font-size:16px;
font-weight:bold;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25d366;
width:60px;
height:60px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
box-shadow:0 0 15px #25d366;
}

footer{
text-align:center;
padding:30px 10px;
color:#777;
font-size:13px;
}

</style>
</head>

<body>

<header>
<div>
<div class="logo">ẞoost-by Ecr_aaM</div>
<div class="status">🟢 En ligne 24h/24</div>
</div>

<div id="clock"></div>
</header>

<div class="banner">
<span>
🔥 Promotion active • Service ultra rapide • TikTok & Facebook disponible • Nouveau système premium
</span>
</div>

<div class="tabs">
<div class="tab">Facebook</div>
<div class="tab">TikTok</div>
<div class="tab">Instagram</div>
</div>

<div class="services">

<div class="card">

<div class="badges">
<div class="badge top">🔥 TOP POPULAIRE</div>
<div class="badge fast">⚡ RAPIDE</div>
</div>

<div class="service-title">
Facebook Réactions
</div>

<div class="price">
1520 Ar /1k
</div>

<div class="info">
Temps estimé : 0 -
